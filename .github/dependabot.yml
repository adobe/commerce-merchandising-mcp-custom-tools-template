version: 2
updates:
  # generator dependencies and the dependencies written into generated apps (src/templates/package.json)
  - package-ecosystem: npm
    directories:
      - /
      - /src/templates
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
